[package]
name = "org-files-db"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
orgize = "0.10.0-alpha.10"
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[lib]
name = "org_files_db"
path = "src/lib.rs"

[[bin]]
name = "orgfdb"
path = "src/main.rs"
