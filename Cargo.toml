[package]
name = "org-files-db"
version = "0.1.0"
edition = "2021"
description = "SQLite index and query tool for Org files"
license-file = "LICENSE"
repository = "https://github.com/hubisan/org-files-db"
readme = "README.org"
keywords = ["org-mode", "sqlite", "cli", "indexer"]
categories = ["command-line-interface", "database", "parsing", "text-processing"]

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.5", features = ["derive"] }
globset = "0.4.19"
notify = "8.2.0"
orgize = "0.10.0-alpha.10"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "functions", "limits", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
sha2 = "0.11.0"
toml = "1.1.4"

[features]
presentation-parallel-benchmark = []

[lib]
name = "org_files_db"
path = "src/lib.rs"

[[bin]]
name = "orgfdb"
path = "src/main.rs"

[[bin]]
name = "orgfdb-presentation-parallel-benchmark"
path = "src/bin/orgfdb-presentation-parallel-benchmark.rs"
required-features = ["presentation-parallel-benchmark"]
