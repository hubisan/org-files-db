[package]
name = "org-files-db"
version = "0.1.0"
edition = "2021"
description = "SQLite index and query tool for Org files"
license-file = "LICENSE"
repository = "https://github.com/hubisan/org-files-db"
readme = "README.org"
keywords = ["org-mode", "sqlite", "cli", "indexer"]
categories = ["command-line-interface", "database", "parsing", "text-processing"]

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4.18"
orgize = "0.10.0-alpha.10"
regex = "1.11"
rusqlite = { version = "0.32", features = ["functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

[lib]
name = "org_files_db"
path = "src/lib.rs"

[[bin]]
name = "orgfdb"
path = "src/main.rs"
