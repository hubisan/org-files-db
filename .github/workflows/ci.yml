name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml, so CI and local runs match.
      - run: rustup toolchain install
      - run: make ci
